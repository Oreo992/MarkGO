name: Windows Release

# Builds the MarkGo for Windows installer on a Windows runner.
# - Push a tag like `win-v1.0.0` -> builds and publishes a GitHub Release
#   with the NSIS (.exe) and MSI installers attached.
# - Manual run (workflow_dispatch) -> builds and uploads the installers as
#   downloadable workflow artifacts (no release).

on:
  workflow_dispatch:
  push:
    tags:
      - "win-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: platforms/windows/src-tauri

      - name: Install frontend dependencies
        working-directory: platforms/windows
        run: npm install

      - name: Build & publish release (on tag)
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: platforms/windows
          tagName: ${{ github.ref_name }}
          releaseName: "MarkGo for Windows ${{ github.ref_name }}"
          releaseBody: |
            MarkGo for Windows 安装包（由 GitHub Actions 自动构建）。

            - `MarkGo_*_x64-setup.exe` — NSIS 安装程序（推荐）
            - `MarkGo_*_x64_en-US.msi` — MSI 安装程序

            首次安装如需 WebView2 运行时，安装程序会自动引导。
          releaseDraft: false
          prerelease: false

      - name: Build only (manual run)
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: platforms/windows

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markgo-windows-installers
          path: |
            platforms/windows/src-tauri/target/release/bundle/nsis/*.exe
            platforms/windows/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
